# Health check endpoint: http://<host>/ping (port 80 only) answered by PHP-FPM.
# Lives here, at server level, so it also applies to images that override
# sites-available/000-default.conf.

<IfModule rewrite_module>
	# Push the rule below into every VirtualHost, ahead of its own rules,
	# so the usual "redirect everything to https" does not catch /ping.
	RewriteEngine on
	RewriteOptions InheritDownBefore
	RewriteCond %{SERVER_PORT} =80
	RewriteRule ^/ping$ - [END]
</IfModule>

<If "%{SERVER_PORT} == '80' && %{REQUEST_URI} == '/ping'">
	SetHandler "proxy:fcgi://127.0.0.1:9000"
</If>
